replicaCount: 1

image:
  repository: ghcr.io/alperencelik/oxide-operator
  pullPolicy: IfNotPresent
  # Defaults to the chart's appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  # Defaults to the fullname of the release.
  name: ""

# Leader election keeps a single active manager when replicaCount > 1.
leaderElect: true

# Extra args for the manager, e.g. ["--instance-poll-interval=30s"].
extraArgs: []

resources:
  limits:
    cpu: 500m
    memory: 128Mi
  requests:
    cpu: 10m
    memory: 64Mi

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}
