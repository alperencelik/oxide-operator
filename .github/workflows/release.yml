name: Release

on:
  push:
    tags:
      - 'v*'

permissions: {}

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  release:
    permissions:
      contents: write
      packages: write
    name: Build image and publish release
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Collect image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      # The builder stage runs on the native arch and cross-compiles, so no QEMU is needed.
      - name: Build and push image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Generate install.yaml
        run: make build-installer IMG=${{ env.IMAGE }}:${{ steps.meta.outputs.version }}

      # helm is preinstalled on ubuntu-latest. The chart is versioned by the tag, so its
      # version and appVersion always match the operator it deploys.
      - name: Package and push Helm chart
        run: |
          version="${GITHUB_REF_NAME#v}"
          helm registry login ghcr.io -u '${{ github.actor }}' --password-stdin <<< '${{ secrets.GITHUB_TOKEN }}'
          helm package charts/oxide-operator --version "$version" --app-version "$version" --destination dist
          helm push "dist/oxide-operator-$version.tgz" oci://ghcr.io/${{ github.repository_owner }}/charts

      - name: Publish release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            dist/install.yaml
            dist/oxide-operator-*.tgz
          generate_release_notes: true
